<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Figtree:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}html,body{width:720px;height:1280px;overflow:hidden;background:#1D2422}
#cena{position:absolute;inset:0;overflow:hidden;background:var(--bg);color:var(--tr);padding:118px 54px 0}
.escuro{--bg:#1D2422;--fu:#1D2422;--tr:#fff;--ac:#B9F24B;--a2:#57655F;--sp:#2A3531}
.verde{--bg:#00D568;--fu:#00D568;--tr:#15201A;--ac:#fff;--a2:#B9F24B;--sp:#17E47C}
.lima{--bg:#B9F24B;--fu:#B9F24B;--tr:#15201A;--ac:#00D568;--a2:#fff;--sp:#CBF876}
.spot{position:absolute;left:50%;top:640px;width:760px;height:760px;margin:-380px;border-radius:50%;background:var(--sp);animation:spot 1s cubic-bezier(.2,1.2,.3,1) both}
@keyframes spot{from{transform:scale(.2)}}
h1{position:relative;z-index:1;font:800 118px/.9 "Bricolage Grotesque",sans-serif;font-stretch:75%;text-transform:uppercase;text-wrap:balance}
h1 span{display:inline-block;overflow:hidden;vertical-align:top;padding:8px 0 2px;margin-top:-8px}h1 i{display:inline-block;font-style:normal;animation:sobe .5s cubic-bezier(.2,.9,.2,1) both}
@keyframes sobe{from{transform:translateY(112%)}}
.dz{position:absolute;left:70px;right:70px;top:420px;animation:entra .6s cubic-bezier(.25,1.5,.4,1) .12s both}.dz svg{width:100%;display:block}
@keyframes entra{from{transform:translateY(60px) scale(.55);opacity:0}}
.bn{position:absolute;left:50px;top:170px;width:620px;height:1102px;-webkit-mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);animation:entra .6s cubic-bezier(.25,1.4,.4,1) .1s both}.bn img{position:absolute;inset:0;width:100%;height:100%;visibility:hidden}
#barra{position:absolute;left:40px;right:40px;top:44px;display:flex;gap:8px}#barra u{flex:1;height:7px;border-radius:4px;background:rgb(128 140 134/.38);overflow:hidden;text-decoration:none}#barra u b{display:block;height:100%;background:var(--pt,#fff)}
#leg{position:absolute;left:44px;right:44px;bottom:150px;text-align:center;text-wrap:balance;font:800 50px/1.5 Figtree,sans-serif}
#leg span{background:#0B100E;color:#fff;box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:6px 20px 10px;border-radius:16px}#leg b{color:#B9F24B}
#veu{position:absolute;inset:0;pointer-events:none}
</style></head><body><div id="cena"></div><div id="veu"></div><div id="barra"></div><div id="leg"></div>
<script>/*DESENHOS*/</script>
<script>
const CORES = ["escuro", "verde", "lima"], SOLIDO = {escuro:"#1D2422", verde:"#00D568", lima:"#B9F24B"};
const e = (t) => t.replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let R, atual = -1; const vistos = new Set();
function iniciar(r) { R = r; vistos.clear(); R.cenas.forEach((c) => { c.ds = qualDesenho(c.cena, vistos); }); atual = -1;
  document.getElementById("barra").innerHTML = R.cenas.map(() => "<u><b></b></u>").join(""); }
async function montar(i) {
  const c = R.cenas[i], cor = CORES[i % 3], el = document.getElementById("cena"); el.className = cor; let k = 0;
  el.innerHTML = '<div class="spot"></div><h1>' + c.na_tela.split(" ").map((p) => '<span><i style="animation-delay:' + (.1 + k++ * .07) + 's">' + e(p) + "</i></span>").join(" ") + '</h1>' + (R.bonecos[c.ds] ? '<div class="bn">' + R.bonecos[c.ds].map((s) => '<img src="' + s + '">').join("") + "</div>" : '<div class="dz">' + svgDesenho(c.ds) + "</div>");
  await Promise.all([...el.querySelectorAll(".bn img")].map((x) => x.decode()));
  document.body.style.setProperty("--pt", cor === "escuro" ? "#fff" : "#15201A");
  const h = el.querySelector("h1"); if (h.offsetHeight > 260) h.style.fontSize = "92px"; // três linhas não encostam no desenho
  for (const a of document.getAnimations()) a.pause();
}
async function ir(t) {
  let i = R.cenas.findIndex((c) => t < c.fim); if (i < 0) i = R.cenas.length - 1;
  if (i !== atual) { await montar(i); atual = i; }
  const c = R.cenas[i], l = t - c.ini;
  document.querySelectorAll(".bn img").forEach((x, k, l2) => { x.style.visibility = k === Math.floor(l * 12 + 1e-6) % l2.length ? "visible" : "hidden"; });
  for (const a of document.getAnimations()) a.currentTime = l * 1000;
  document.querySelectorAll("#barra b").forEach((b, k) => { b.style.width = (k < i ? 100 : k > i ? 0 : 100 * l / (c.fim - c.ini)) + "%"; });
  // troca de cena: a cor da próxima entra de baixo
  const p = Math.max(0, 1 - (c.fim - t) / .22), v = document.getElementById("veu"), ult = i === R.cenas.length - 1;
  v.style.cssText = "background:" + SOLIDO[CORES[(i + 1) % 3]] + ";clip-path:inset(" + (ult ? 100 : 100 - 100 * p * p) + "% 0 0 0)";
  const g = c.grupos.find((g) => l >= g[0].t - .05 && l < g.fim);
  document.getElementById("leg").innerHTML = g && !(p > 0 && !ult) ? "<span>" + g.map((w) => l >= w.t - .03 && l < w.f ? "<b>" + e(w.p) + "</b>" : e(w.p)).join(" ") + "</span>" : "";
}
</script></body></html>
