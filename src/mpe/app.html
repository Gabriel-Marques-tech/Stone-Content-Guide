<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Extrato de Conteúdo MPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
/* A maquininha é a ação (uma crença por vez, palpite antes do resultado) e o extrato é onde os
   comprovantes ficam. Visual claro e único, de propósito: papel, verde e as três teclas. */
:root {
  --fundo: #f1f3f2; --branco: #ffffff; --papel: #fffef9;
  --tinta: #10201a; --tinta2: #51605a; --tinta3: #7b8983; --linha: #dfe5e2;
  --verde: #00a868; --verde-texto: #00794c; --verde-fundo: #0b3d2e; --verde-claro: #e3f6ec;
  --amarelo: #f2b705; --vermelho: #d9412b; --vermelho-claro: #fbe7e2;
  --texto: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Space Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; color: var(--tinta); font: 16px/1.5 var(--texto); min-height: 100vh; background-color: #062a1f;
  background-image: radial-gradient(60vw 50vh at 12% -8%, rgb(0 168 104 / .55), transparent 70%), radial-gradient(46vw 44vh at 96% 18%, rgb(132 224 60 / .22), transparent 70%), radial-gradient(70vw 60vh at 60% 110%, rgb(0 168 104 / .38), transparent 70%); background-attachment: fixed; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--verde-texto); }
:focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: clamp(28px, 3.2vw, 36px); font-weight: 800; line-height: 1.1; letter-spacing: -.02em; text-wrap: balance; }
h2 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.sub { color: var(--tinta2); }
.peq { font-size: 13.5px; color: var(--tinta2); }
.num { font-variant-numeric: tabular-nums; }

/* topo: sobre o verde */
.topo { display: flex; align-items: center; gap: 8px 28px; flex-wrap: wrap; padding: 18px max(20px, env(safe-area-inset-right, 0px)) 14px max(20px, env(safe-area-inset-left, 0px)); max-width: 1240px; margin: 0 auto; color: #fff; }
.topo .marca { font-weight: 800; font-size: 17px; margin-right: auto; color: #fff; text-decoration: none; }
.topo nav { display: flex; gap: 4px; flex-wrap: wrap; }
.topo nav a { text-decoration: none; color: rgb(255 255 255 / .72); font-weight: 600; padding: 8px 14px; border-radius: 999px; }
.topo nav a:hover { color: #fff; }
.topo nav a[aria-current='page'] { background: #fff; color: var(--verde-fundo); }
.topo nav a b { background: #b9f24b; color: #10320a; border-radius: 999px; font-size: 12px; padding: 1px 7px; margin-left: 6px; }
.topo .peq { color: rgb(255 255 255 / .7); }
main { max-width: 1240px; margin: 0 auto; padding: 10px max(20px, env(safe-area-inset-right, 0px)) 80px max(20px, env(safe-area-inset-left, 0px)); }
.folha { background: var(--fundo); border-radius: 28px; padding: clamp(20px, 3vw, 36px); box-shadow: 0 30px 80px rgb(0 0 0 / .35); }
.col { max-width: 800px; margin: 0 auto; }

/* peças comuns */
.btn { border: 0; border-radius: 10px; padding: 11px 18px; font-weight: 700; background: var(--verde); color: #fff; text-decoration: none; display: inline-block; }
.btn.leve { background: #e4e9e6; color: var(--tinta); }
.btn:disabled { opacity: .5; cursor: default; }
.acoes { display: flex; gap: 10px; flex-wrap: wrap; }
.campo { background: var(--branco); border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px; max-width: 100%; }
.campo:focus { border-color: var(--verde); outline: 0; }
.pilulas { display: flex; gap: 8px; flex-wrap: wrap; }
.pilulas button { border: 1px solid var(--linha); background: var(--branco); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; }
.pilulas button[aria-pressed='true'] { background: var(--tinta); color: #fff; border-color: var(--tinta); }
.aviso { background: var(--vermelho-claro); border-radius: 12px; padding: 12px 16px; }
.nota-livre { background: #fdf3d3; border-radius: 12px; padding: 12px 16px; font-size: 14.5px; }
.torrada { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--tinta); color: #fff; padding: 10px 18px; border-radius: 999px; z-index: 50; max-width: min(560px, 90vw); font-size: 14.5px; }

/* maquininha: imagem oficial do aparelho, com a interface encaixada na tela em perspectiva */
.banca { display: grid; grid-template-columns: minmax(260px, 380px) auto minmax(260px, 340px); gap: clamp(20px, 3vw, 44px); justify-content: center; align-items: start; color: #fff; }
.banca h1 { color: #fff; }
.banca .intro { color: rgb(255 255 255 / .78); margin: 10px 0 18px; }
.crencas { list-style: none; margin: 0; padding: 0 6px 0 0; border-top: 1px solid rgb(255 255 255 / .18); max-height: 46vh; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgb(255 255 255 / .3) transparent; }
.crencas button { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid rgb(255 255 255 / .18); padding: 11px 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 500; color: rgb(255 255 255 / .86); }
.crencas button:hover { color: #fff; }
.crencas button[aria-pressed='true'] { font-weight: 800; color: #b9f24b; }
.crencas i { font-style: normal; color: rgb(255 255 255 / .55); font-size: 13px; font-weight: 500; white-space: nowrap; }
.crencas i.feita { color: #fff; font-family: var(--mono); font-size: 12px; }
.maq { position: relative; height: min(76vh, 700px); aspect-ratio: 670 / 1000; filter: drop-shadow(0 40px 50px rgb(0 0 0 / .45)); animation: flutuar 6s ease-in-out infinite; }
@keyframes flutuar { 50% { transform: translateY(-8px); } }
@media (prefers-reduced-motion: reduce) { .maq { animation: none; } }
.maq img { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
.visor { position: absolute; left: 0; top: 0; width: 360px; height: 800px; transform-origin: 0 0; background: linear-gradient(170deg, #f6fbf7, #e4f5ea); border-radius: 30px; padding: 62px 24px 26px; display: flex; flex-direction: column; gap: 14px; color: var(--tinta); overflow: hidden; }
.visor .rot { font: 700 15px var(--mono); color: var(--verde-texto); letter-spacing: .04em; }
.visor b.frase-v { font: 800 33px/1.14 var(--texto); letter-spacing: -.02em; }
.visor .pergunta { font-size: 19px; color: var(--tinta2); }
.visor .teclas { display: grid; gap: 12px; margin-top: auto; }
.visor .teclas button { border: 0; border-radius: 20px; padding: 22px 10px; font: 800 21px var(--texto); color: #fff; box-shadow: 0 5px 0 rgb(0 0 0 / .22); }
.visor .teclas button:active { transform: translateY(4px); box-shadow: 0 1px 0 rgb(0 0 0 / .22); }
.t-sobe { background: var(--verde); } .t-tanto { background: var(--amarelo); color: #3a2c00 !important; } .t-cai { background: var(--vermelho); }
.visor .resultado { margin-top: auto; display: grid; gap: 14px; }
.visor .resultado .selo { font: 800 31px/1.05 var(--texto); letter-spacing: -.02em; }
.visor .resultado .selo.sobe { color: var(--verde-texto); } .visor .resultado .selo.cai { color: var(--vermelho); }
.visor .resultado p { font-size: 18px; color: var(--tinta2); }
.visor .resultado button { border: 0; border-radius: 20px; padding: 20px 10px; font: 800 20px var(--texto); background: var(--verde-fundo); color: #fff; }
.saida { display: grid; gap: 16px; align-content: start; min-width: 0; padding-top: 6px; }
.saida .peq { color: rgb(255 255 255 / .8); }
.saida .btn.leve { background: rgb(255 255 255 / .14); color: #fff; }
.espera { color: rgb(255 255 255 / .78); font-size: 14.5px; border: 1.5px dashed rgb(255 255 255 / .35); border-radius: 12px; padding: 18px; }
.cupom { --d: 9px; background: var(--papel); color: var(--tinta); font: 13px/1.6 var(--mono); padding: 20px 18px calc(var(--d) + 18px); filter: drop-shadow(0 14px 22px rgb(0 0 0 / .35));
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / calc(2 * var(--d)) 100%; mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / calc(2 * var(--d)) 100%; }
.cupom.novo { animation: imprimir .8s cubic-bezier(.2,.8,.2,1) both; }
@keyframes imprimir { from { clip-path: inset(0 0 100% 0); transform: translateY(-24px); } to { clip-path: inset(0); transform: none; } }
@media (prefers-reduced-motion: reduce) { .cupom.novo { animation: none; } }
.cupom hr { border: 0; border-top: 1px dashed #9aa7a1; margin: 10px 0; }
.cupom dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.cupom dd { margin: 0; text-align: right; }
.cupom .frase { font: 700 15px/1.3 var(--texto); }
.cupom .cab { text-align: center; font-weight: 700; letter-spacing: .1em; }
.carimbo + .carimbo { margin-top: 6px; }
.carimbo { margin-top: 12px; text-align: center; font-weight: 700; letter-spacing: .14em; border: 2px solid; border-radius: 6px; padding: 6px; }
.carimbo.sobe { color: var(--verde-texto); } .carimbo.cai { color: var(--vermelho); }
.cupom .fino { margin-top: 10px; font-size: 11.5px; color: #6b7772; }
@media (max-width: 1040px) { .banca { grid-template-columns: 1fr; justify-items: center; } .banca > div:first-child { width: 100%; } .crencas { max-height: 34vh; } .saida { width: min(360px, 100%); } }

/* extrato */
.saldo { padding: 14px 0 22px; border-bottom: 1px solid var(--linha); }
.saldo strong { font: 800 46px/1.05 var(--texto); letter-spacing: -.03em; display: block; margin: 4px 0 8px; }
.grupo { font: 700 12px var(--texto); letter-spacing: .09em; text-transform: uppercase; color: var(--tinta3); padding: 24px 0 8px; }
.lanc { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--linha); display: grid; grid-template-columns: 36px 1fr auto; gap: 14px; align-items: center; padding: 14px 0; text-align: left; }
.lanc:hover { background: #e9eeeb; }
.bola { width: 36px; height: 36px; border-radius: 50%; background: #e4e9e6; display: grid; place-items: center; font: 700 14px var(--mono); color: var(--tinta2); }
.lanc.sobe .bola { background: var(--verde-claro); color: var(--verde-texto); } .lanc.cai .bola { background: var(--vermelho-claro); color: var(--vermelho); }
.lanc b { font-weight: 700; display: block; }
.lanc.pendente b { font-weight: 500; color: var(--tinta2); }
.valor { text-align: right; font: 700 16px var(--mono); color: var(--tinta2); white-space: nowrap; }
.valor small { display: block; font: 500 12.5px var(--texto); }
.lanc.sobe .valor { color: var(--verde-texto); } .lanc.cai .valor { color: var(--vermelho); }
.abre { padding: 8px 0 22px 50px; border-bottom: 1px solid var(--linha); display: grid; gap: 14px; }
.abre dl { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 24px; }
.abre dt { color: var(--tinta2); font-size: 13px; } .abre dd { margin: 0; font: 700 17px var(--mono); }
@media (max-width: 560px) { .abre { padding-left: 0; } }

/* vídeos */
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px 14px; }
.short { background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.short .capa { aspect-ratio: 3 / 4; border-radius: 12px; background: #dfe5e2 center / cover no-repeat; position: relative; }
.short:hover .capa { box-shadow: 0 0 0 2px var(--verde); }
.short .capa span { position: absolute; left: 6px; top: 6px; background: rgb(0 0 0 / .65); color: #fff; font: 700 11px var(--mono); padding: 2px 6px; border-radius: 6px; }
.short b { font-weight: 700; }
.short .t { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.short .c { font-size: 12.5px; color: var(--tinta3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.secao { display: grid; gap: 12px; margin-top: 28px; }
.gaveta { position: fixed; inset: 0 0 0 auto; width: min(460px, 100%); background: var(--branco); box-shadow: -12px 0 40px rgb(0 0 0 / .2); z-index: 30; overflow-y: auto; padding: 18px 22px 28px; display: grid; gap: 14px; align-content: start; }
.veu { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 29; }
.gaveta img { width: 100%; border-radius: 12px; aspect-ratio: 16 / 10; object-fit: cover; background: #dfe5e2; }
.tab { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.tab td, .tab th { padding: 9px 6px; border-bottom: 1px solid var(--linha); text-align: left; vertical-align: top; }
.tab th { color: var(--tinta3); font-size: 12.5px; font-weight: 600; }
.tab td.n, .tab th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tab tr.clicavel { cursor: pointer; } .tab tr.clicavel:hover td { background: #e9eeeb; }
.rolagem-x { overflow-x: auto; }

/* agente */
.pedido { display: grid; gap: 10px; }
.pedido textarea { width: 100%; min-height: 84px; resize: vertical; font-size: 16.5px; }
.criativo { padding: 18px 0; border-top: 1px solid var(--linha); display: grid; gap: 8px; }
.criativo h3 { font-size: 18px; font-weight: 800; line-height: 1.3; }
.criativo dl { margin: 0; display: grid; grid-template-columns: 80px 1fr; gap: 6px 12px; font-size: 14.5px; }
.criativo dt { color: var(--tinta3); } .criativo dd { margin: 0; }
.fita { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.fita .short { flex: 0 0 128px; }
.exemplos, .gerar { display: grid; gap: 10px; margin-top: 8px; }
.fita-yt { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.fita-yt figure { margin: 0; flex: 0 0 190px; display: grid; gap: 6px; }
.fita-yt iframe, video.gerado { width: 100%; aspect-ratio: 9 / 16; border: 0; border-radius: 14px; background: #0c1512; display: block; }
.gerar > video.gerado { width: min(250px, 100%); }
.fita-yt figcaption { font-size: 12.5px; color: var(--tinta3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* molde de gravação: cena 3D sem marca + legenda viva por cima */
.molde { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(20px, 4vw, 48px); align-items: start; }
@media (max-width: 820px) { .molde { grid-template-columns: 1fr; justify-items: center; } }
.palco-m { position: relative; width: min(330px, 80vw); aspect-ratio: 9 / 16; border-radius: 30px; overflow: hidden; background: #2f9e62; box-shadow: 0 24px 50px rgb(0 0 0 / .28), 0 0 0 8px #10201a; }
.palco-m video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.palco-m .trilhos { position: absolute; left: 12px; right: 12px; top: 12px; display: flex; gap: 5px; z-index: 3; }
.palco-m .trilhos i { flex: 1; height: 4px; border-radius: 4px; background: rgb(255 255 255 / .38); overflow: hidden; }
.palco-m .trilhos i b { display: block; height: 100%; width: 0; background: #fff; }
.palco-m .direcao { position: absolute; left: 12px; right: 12px; top: 28px; z-index: 3; display: flex; gap: 8px; align-items: center; background: rgb(11 61 46 / .9); color: #fff; border-radius: 14px; padding: 9px 12px; font-size: 13.5px; font-weight: 600; line-height: 1.25; }
.palco-m .direcao span { background: #b9f24b; color: #10320a; font: 800 10.5px var(--texto); letter-spacing: .08em; padding: 3px 7px; border-radius: 6px; white-space: nowrap; }
.palco-m .legenda { position: absolute; left: 14px; right: 14px; bottom: 74px; z-index: 3; display: flex; flex-wrap: wrap; gap: 6px 8px; justify-content: center; text-align: center; }
.palco-m .legenda span { font: 800 30px/1.1 var(--texto); letter-spacing: -.01em; color: #fff; text-transform: uppercase; text-shadow: 0 3px 0 rgb(0 0 0 / .35), 0 0 14px rgb(0 0 0 / .35); opacity: 0; transform: translateY(14px) scale(.7) rotate(-4deg); transition: opacity .16s, transform .28s cubic-bezier(.2, 1.7, .4, 1); }
.palco-m .legenda span.on { opacity: 1; transform: none; }
.palco-m .legenda span.vaga { background: #b9f24b; color: #10320a; text-shadow: none; padding: 2px 10px 4px; border-radius: 10px; transform-origin: center; }
.palco-m .legenda span.vaga.on { transform: rotate(-2deg); }
@media (prefers-reduced-motion: reduce) { .palco-m .legenda span { transition: none; } }
.palco-m .controle { position: absolute; left: 0; right: 0; bottom: 14px; z-index: 3; display: flex; justify-content: center; gap: 10px; }
.palco-m .controle button { border: 0; border-radius: 999px; padding: 9px 18px; font-weight: 700; background: rgb(255 255 255 / .92); color: var(--tinta); }
.formula { font: 800 clamp(22px, 2.6vw, 30px)/1.2 var(--texto); letter-spacing: -.02em; }
.formula mark { background: #b9f24b; color: #10320a; border-radius: 8px; padding: 0 8px; }
.campos-m { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.campos-m label { display: grid; gap: 5px; font-size: 13.5px; font-weight: 600; color: var(--tinta2); }
.campos-m input { width: 100%; }
.roteiro-m { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--linha); }
.roteiro-m button { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--linha); padding: 12px 6px; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.roteiro-m button:hover { background: #e9eeeb; }
.roteiro-m button[aria-current='true'] { background: var(--verde-claro); }
.roteiro-m em { font: 800 14px var(--mono); font-style: normal; color: var(--verde-texto); }
.roteiro-m b { display: block; } .roteiro-m small { color: var(--tinta2); font-size: 13.5px; }
details > summary { cursor: pointer; font-weight: 700; padding: 6px 0; }
.trabalhando { display: flex; gap: 12px; align-items: center; color: var(--tinta2); }
.trabalhando i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--linha); border-top-color: var(--verde); animation: girar 1s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header class="topo"><a class="marca" href="#maquininha">Extrato de Conteúdo</a><nav id="nav" aria-label="Principal"></nav><span class="peq num" id="base"></span></header>
<main id="tela"><p class="sub">Carregando a base…</p></main>
<div class="torrada" id="torrada" role="status" hidden></div>
<div id="camada"></div>

<script>
const $ = (id) => document.getElementById(id);
const e = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n = (v) => Number(v).toLocaleString('pt-BR');
const pct = (v, d = 0) => (v * 100).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
const pts = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(Math.round(v * 100));
const capa = (id) => `https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`;
const yt = (id) => `https://www.youtube.com/shorts/${encodeURIComponent(id)}`;

// Cada crença é uma escolha de quem grava, ligada a uma característica que a base mede. O resultado
// sai em dois desfechos: alcance (views) e reação (curtidas e comentários por view).

async function api(caminho, corpo) {
  const r = await fetch('/api/' + caminho, corpo ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(corpo) } : undefined);
  const j = await r.json().catch(() => ({ erro: 'Resposta inesperada do servidor.' }));
  if (!r.ok) throw new Error(j.erro || 'Falha no servidor.');
  return j;
}

function preparar() {
  const peso = (c) => Math.max(...['alcance', 'reacao'].map((d) => ['sobe', 'cai'].includes(c[d].veredito) ? 1 + Math.abs(c[d].efeito) : Math.abs(c[d].efeito) / 10));
  C = D.crencas.filter((t) => FRASES[t.atributo]).map((t) => {
    const a = t.alcance.veredito === 'sobe', v = t.reacao.veredito === 'sobe';
    return { ...t, frase: FRASES[t.atributo], grupo: grupo(t.atributo), real: a && v ? 'ambos' : a ? 'alcance' : v ? 'reacao' : 'nenhum' };
  }).sort((x, y) => peso(y) - peso(x));
}

// Encaixa o visor (360×800) no quadrilátero da tela dentro da imagem (medido em px da imagem de 670×1000).
const QUAD = [[167, 63], [512, 83], [618, 864], [252, 877]];
function encaixarVisor() {
  const maq = $('maq'), visor = $('visor'); if (!maq) return;
  const k = maq.clientWidth / 670, d = QUAD.map(([x, y]) => [x * k, y * k]), o = [[0, 0], [360, 0], [360, 800], [0, 800]];
  const adj = (m) => [m[4] * m[8] - m[5] * m[7], m[2] * m[7] - m[1] * m[8], m[1] * m[5] - m[2] * m[4], m[5] * m[6] - m[3] * m[8], m[0] * m[8] - m[2] * m[6], m[2] * m[3] - m[0] * m[5], m[3] * m[7] - m[4] * m[6], m[1] * m[6] - m[0] * m[7], m[0] * m[4] - m[1] * m[3]];
  const mul = (a, b) => { const c = Array(9); for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) c[3 * i + j] = a[3 * i] * b[j] + a[3 * i + 1] * b[3 + j] + a[3 * i + 2] * b[6 + j]; return c; };
  const base = (p) => { const m = [p[0][0], p[1][0], p[2][0], p[0][1], p[1][1], p[2][1], 1, 1, 1], a = adj(m), v = [0, 1, 2].map((i) => a[3 * i] * p[3][0] + a[3 * i + 1] * p[3][1] + a[3 * i + 2]); return mul(m, [v[0], 0, 0, 0, v[1], 0, 0, 0, v[2]]); };
  const t = mul(base(d), adj(base(o))).map((x, _, arr) => x / arr[8]);
  visor.style.transform = `matrix3d(${t[0]},${t[3]},0,${t[6]},${t[1]},${t[4]},0,${t[7]},0,0,1,0,${t[2]},${t[5]},0,${t[8]})`;
}
addEventListener('resize', encaixarVisor);

async function carregarVideos(juntar) {
  try {
    if (S.carac !== null) { const a = C[S.carac].atributo;
      for (const [lado, q] of [['top', 'top=1'], ['resto', 'resto=1']]) { const r = await api(`posts?atributo=${encodeURIComponent(a)}&${q}`); if (!$('g-' + lado)) return;

      return; }
    const r = await api('posts?' + new URLSearchParams({ ...S.filtros, pagina: S.pagina }));
    S.posts = juntar ? { ...r, posts: [...S.posts.posts, ...r.posts] } : r;
    if (!$('grade')) return;
    $('grade').innerHTML = S.posts.posts.map(short).join('') || '<p class="sub">Nenhum vídeo com esses filtros.</p>';
    $('contagem').textContent = `${n(r.total)} vídeos · ${n(r.no_top)} no topo`; $('mais').hidden = S.posts.posts.length >= r.total;
  } catch (x) { avisar(x.message); }
}

const ir = (t) => { if (tela() === t) desenhar(); else location.hash = t; };

document.addEventListener('click', (ev) => {
  const a = (s) => ev.target.closest(s); let el;
  if ((el = a('[data-sel]'))) { S.sel = +el.dataset.sel; desenhar(true); }
  else if ((el = a('[data-palpite]'))) { P[C[S.sel].atributo] = { palpite: el.dataset.palpite, quando: Date.now() }; guardar(); S.novo = true; desenhar(true); }
  else if ((el = a('[data-ir]'))) { S.sel = +el.dataset.ir; ir('maquininha'); }
  else if (a('[data-seguinte]')) { const i = C.findIndex((c) => !P[c.atributo]); if (i >= 0) { S.sel = i; desenhar(true); } }
  else if (a('[data-proxima]')) { const i = C.findIndex((c) => !P[c.atributo]); if (i >= 0) S.sel = i; }
  else if (a('[data-limpar]')) { P = {}; guardar(); S.aberto = null; desenhar(); avisar('Palpites apagados deste navegador.'); }
  else if ((el = a('[data-filtro]'))) { S.filtro = el.dataset.filtro; S.aberto = null; desenhar(true); }
  else if ((el = a('[data-abre]'))) { S.aberto = S.aberto === +el.dataset.abre ? null : +el.dataset.abre; desenhar(true); }
  else if ((el = a('[data-videos]'))) { S.carac = +el.dataset.videos; ir('videos'); }
  else if (a('[data-todos]')) { S.carac = null; desenhar(); }
  else if ((el = a('[data-criar]'))) { const c = C[+el.dataset.criar], tema = TEMAS[c.atributo.split('=')[1]]; Object.assign(S, { origem: +el.dataset.criar, modo: 'gerar_criativo', resultado: null, pedido: c.atributo.startsWith('tema') && tema ? tema : '' }); ir('agente'); }
  else if ((el = a('[data-mmolde]'))) { M.molde = +el.dataset.mmolde; M.cena = 0; desenharMoldeDeNovo(); }
  else if ((el = a('[data-mcena]'))) tocarCena(+el.dataset.mcena);
  else if (a('[data-mtoca]')) { M.tocando = !M.tocando; const v = $('vm'); M.tocando ? v.play().catch(() => {}) : v.pause(); a('[data-mtoca]').textContent = M.tocando ? 'Pausar' : 'Tocar'; }
  else if (a('[data-minicio]')) tocarCena(0);
  else if ((el = a('[data-gerar]'))) { el.disabled = true; el.textContent = 'Enviando…'; gerarVideo(+el.dataset.gerar); }
  else if ((el = a('[data-post]'))) abrirPost(el.dataset.post);
  else if (a('[data-fechar]')) $('camada').innerHTML = '';
  else if (a('#mais')) { S.pagina++; carregarVideos(true); }
  else if ((el = a('[data-exec]'))) { const x = S.execucoes[el.dataset.exec]; Object.assign(S, { modo: x.entrada.mode, segmento: x.entrada.segment || '', pedido: x.entrada.query, resultado: x.saida, origem: null }); desenhar(); }
});
document.addEventListener('submit', (ev) => { if (ev.target.id === 'form') { ev.preventDefault(); pedir(); } });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') $('camada').innerHTML = ''; if (ev.key === 'Enter' && ev.target.matches?.('tr[data-exec]')) ev.target.click(); });
let espera;
document.addEventListener('input', (ev) => { if (ev.target.dataset.mcampo) { moldeAtual().campos[ev.target.dataset.mcampo] = ev.target.value; pintarMolde(); if ($('formula-m')) $('formula-m').innerHTML = formulaM(); return; }
  if (ev.target.id === 'f-busca') { clearTimeout(espera); espera = setTimeout(() => { S.filtros.busca = ev.target.value; S.pagina = 0; carregarVideos(false); }, 250); } });
document.addEventListener('change', (ev) => {
  const id = ev.target.id;
  if (id === 'modo') { S.modo = ev.target.value; S.pedido = $('pedido').value; desenhar(true); }
  else if (id === 'segmento') S.segmento = ev.target.value;
  else if (id.startsWith('f-') && id !== 'f-busca') { S.filtros[id.slice(2)] = ev.target.type === 'checkbox' ? (ev.target.checked ? '1' : '') : ev.target.value; S.pagina = 0; carregarVideos(false); }
});
addEventListener('hashchange', () => desenhar());
api('painel').then((d) => { D = d; preparar(); const i = C.findIndex((c) => !P[c.atributo]); S.sel = i < 0 ? 0 : i; desenhar(); })
  .catch((x) => { $('tela').innerHTML = `<div class="aviso"><b>Não foi possível abrir a base.</b> ${e(x.message)}</div>`; });
</script>
</body>
</html>
